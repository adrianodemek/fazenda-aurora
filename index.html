<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8fbb77">
<title>Fazenda Aurora | V0.2.2</title>
<link rel="stylesheet" href="./src/styles/game.css?v=022">
</head><body>
<main id="game" aria-label="Fazenda Aurora">
<canvas id="map" aria-label="Mapa isométrico interativo"></canvas>
<header class="topbar">
 <div class="logo">🌻 <strong>Fazenda Aurora</strong><small>V0.2.2</small></div>
 <div class="stats"><span>🪙 <strong id="coins">80</strong></span><span>⭐ Nível <strong id="level">1</strong></span></div>
</header>
<button type="button" id="fullscreen" class="fullscreen-btn" aria-label="Ativar tela cheia" aria-pressed="false" title="Ativar tela cheia"
style="position:fixed;z-index:1000;top:calc(12px + env(safe-area-inset-top, 0px));right:calc(12px + env(safe-area-inset-right, 0px));min-width:124px;height:43px;display:flex;align-items:center;justify-content:center;gap:7px;padding:6px 9px;border-radius:12px;border:2px solid #ffffff;background:#236b37;color:#ffffff;box-shadow:0 3px 0 #144924,0 6px 18px #0007;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap">
<span aria-hidden="true" style="font-size:21px;line-height:1">⛶</span><span class="fs-label">TELA CHEIA</span></button>
<aside class="zoom"><button id="plus" aria-label="Aproximar">+</button><button id="minus" aria-label="Afastar">−</button><button id="center" aria-label="Centralizar mapa">⌂</button></aside>
<div class="toast" id="message" role="status" aria-live="polite"></div>
<footer class="bar"><div class="bar-title"><strong>🌱 Minha horta</strong><small id="status">Toque num canteiro para plantar</small></div><div class="seeds" id="seeds"></div></footer>
<div class="rotate"><div>📱 ↻</div><strong>Gire seu celular</strong><p>A Fazenda Aurora é jogada na horizontal.</p></div>
</main>
<script type="module" src="./src/main.js?v=022"></script>
</body></html>
