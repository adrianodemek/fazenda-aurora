<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8fbb77">
<title>Fazenda Aurora | V0.2.7</title>
<link rel="stylesheet" href="./src/styles/game.css?v=027">
</head><body>
<main id="game" aria-label="Fazenda Aurora">
<canvas id="map" aria-label="Mapa isométrico interativo"></canvas>
<header class="topbar">
 <div class="logo">🌻 <strong>Fazenda Aurora</strong><small class="version" style="display:inline!important">V0.2.7</small></div>
 <div class="stats"><span>🪙 <strong id="coins">80</strong></span><span>⭐ Nível <strong id="level">1</strong></span></div>
</header>

<aside class="zoom" aria-label="Controles do mapa">
 <button id="plus" aria-label="Aproximar" title="Aproximar">+</button>
 <button id="minus" aria-label="Afastar" title="Afastar">−</button>
 <button id="fullscreen" type="button" aria-label="Entrar em tela cheia" aria-pressed="false" title="Tela cheia">⛶</button>
 <button id="center" aria-label="Centralizar mapa" title="Centralizar mapa">⌂</button>
</aside>
<div class="toast" id="message" role="status" aria-live="polite"></div>
<footer class="bar"><div class="bar-title"><strong>🌱 Minha horta</strong><small id="status">Toque num canteiro para plantar</small></div><div class="seeds" id="seeds"></div></footer>
<div class="rotate"><div>📱 ↻</div><strong>Gire seu celular</strong><p>A Fazenda Aurora é jogada na horizontal.</p></div>
</main>
<script type="module" src="./src/main.js?v=027"></script>
</body></html>
