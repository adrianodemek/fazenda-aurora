<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8fbb77">
<title>Fazenda Aurora | V0.2.1</title>
<link rel="stylesheet" href="./src/styles/game.css?v=021">
</head><body>
<main id="game" aria-label="Fazenda Aurora">
<canvas id="map" aria-label="Mapa isométrico interativo"></canvas>
<header class="topbar">
 <div class="logo">🌻 <strong>Fazenda Aurora</strong><small>V0.2.1</small></div>
 <div class="stats"><span>🪙 <strong id="coins">80</strong></span><span>⭐ Nível <strong id="level">1</strong></span></div>
</header>
<button type="button" id="fullscreen" class="fullscreen-btn" aria-label="Entrar em tela cheia" title="Tela cheia" aria-pressed="false">
 <svg class="fs-enter" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/>
 </svg>
 <svg class="fs-exit" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16v5h-5"/>
 </svg>
 <span class="fs-label">Tela cheia</span>
</button>
<aside class="zoom"><button id="plus" aria-label="Aproximar">+</button><button id="minus" aria-label="Afastar">−</button><button id="center" aria-label="Centralizar mapa">⌂</button></aside>
<div class="toast" id="message" role="status" aria-live="polite"></div>
<footer class="bar"><div class="bar-title"><strong>🌱 Minha horta</strong><small id="status">Toque num canteiro para plantar</small></div><div class="seeds" id="seeds"></div></footer>
<div class="rotate"><div>📱 ↻</div><strong>Gire seu celular</strong><p>A Fazenda Aurora é jogada na horizontal.</p></div>
</main>
<script type="module" src="./src/main.js?v=021"></script>
</body></html>
