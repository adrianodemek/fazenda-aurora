<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Aurora smoke pendente</title>
<style>body{margin:0}iframe{width:925px;height:390px;border:0}</style></head>
<body><div id="result">PENDING</div><iframe id="farm" src="../index.html"></iframe>
<script type="module">
import {initialFarmView,minimumFarmZoom} from '../src/world/camera.js';
import {FARM_OBJECTS} from '../src/world/layout.js';
import {plotTileWorld,PLOT_WORLD_CENTER,PLOT_ART_SCALE,hitFarmPlotWorld} from '../src/world/plotLayout.js';
import {FREE_PLOTS,LOCKED_PLOTS,PLOT_VISUAL_ORDER} from '../src/config/gameConfig.js';
const frame=document.getElementById('farm');
const result=document.getElementById('result');
let completed=false;
const finish=(message,good)=>{
 if(completed)return;completed=true;
 result.textContent=message;
 document.title=good?'AURORA_BROWSER_PASS':'AURORA_BROWSER_FAIL';
};
const timeout=setTimeout(()=>finish('FALHA: tempo limite',false),7500);
const run=()=>{
 setTimeout(async()=>{
  if(completed)return;
  try{
   const doc=frame.contentDocument;
   if(!doc)throw Error('iframe não acessível');
   const canvas=doc.getElementById('map');
   const minus=doc.getElementById('minus');
   const plus=doc.getElementById('plus');
   const full=doc.getElementById('fullscreen');
   if(!canvas||!minus||!plus||!full)throw Error('interface incompleta');
   if(canvas.width<300||canvas.height<150)throw Error('mapa não foi inicializado');
   const testPixel=canvas.getContext('2d').getImageData(
    Math.floor(canvas.width*.5),Math.floor(canvas.height*.5),1,1).data;
   if(testPixel[3]===0)throw Error('mapa não foi desenhado');
   const initial=initialFarmView(925,390);
   if(!(initial.scale>=minimumFarmZoom(925,390)))throw Error('zoom inicial incorreto');
   // O teste do Chrome valida a cena real e a câmera; os sprites
   // são verificados por testes locais sem estourar o relógio virtual.
   for(const asset of [
    '../public/assets/buildings/doghouse/level-01.svg',
    '../public/assets/buildings/headquarters/level-01.webp',
    '../public/assets/plots/grass-blocked-01.webp'
   ]){
    const response=await fetch(asset,{cache:'no-store'});
    if(!response.ok)throw Error('sprite não carregou: '+asset);
   }
   if(FREE_PLOTS.size!==6||LOCKED_PLOTS.size!==22)
    throw Error('número de parcelas incorreto');
   if(JSON.stringify([...FREE_PLOTS])!==JSON.stringify(PLOT_VISUAL_ORDER.slice(0,6)))
    throw Error('seis terrenos iniciais não são os primeiros da horta');
   // Compara o enquadramento mobile com a foto-matriz: a horta
   // deve ocupar a parte inferior esquerda, abaixo da casinha.
   const field=plotTileWorld(6,4);
   const frameX=initial.x+field.x*initial.scale;
   const frameY=initial.y+field.y*initial.scale;
   if(frameX<150||frameX>470)throw Error('horta fora da esquerda: '+Math.round(frameX));
   if(frameY<250||frameY>390)throw Error('horta fora da parte inferior: '+Math.round(frameY));
   if(PLOT_ART_SCALE<1.8 || PLOT_WORLD_CENTER.y<450)throw Error('horta ainda pequena/alta');
   if(!hitFarmPlotWorld(field.x,field.y))throw Error('canteiro movido não é clicável');
   if(hitFarmPlotWorld(-150,175))throw Error('canteiro fantasma na posição antiga');
   if(!minus.disabled)throw Error('afastamento inicial está liberado');
   plus.click();
   if(minus.disabled)throw Error('zoom + não ativou o -');
   minus.click();
   if(!minus.disabled)throw Error('zoom - passou do enquadramento mínimo');
   const world=FARM_OBJECTS.headquarters;
   if(world.x<=FARM_OBJECTS.doghouse.x)throw Error('sede fora da posição');
   if(world.x>=FARM_OBJECTS.animalPen.x)throw Error('curral não ficou à direita');
   const position=p=>({
     x:initial.x+p.x*initial.scale,
     y:initial.y+p.y*initial.scale
   });
   const house=position(world),pen=position({
    x:FARM_OBJECTS.animalPen.x+FARM_OBJECTS.animalPen.width/2,
    y:FARM_OBJECTS.animalPen.y+FARM_OBJECTS.animalPen.height/2
   });
   if(house.x<=260||house.x>=680)throw Error('sede desalinhada no mobile');
   if(pen.x<=630)throw Error('curral não aparece à direita');
   clearTimeout(timeout);
   finish('SMOKE_OK: cenário, sprites, câmera e zoom',true);
  }catch(error){finish('SMOKE_FAIL: '+error.message,false);}
 },1300);
};
frame.addEventListener('load',run,{once:true});
if(frame.contentDocument?.readyState==='complete')run();
</script></body></html>
