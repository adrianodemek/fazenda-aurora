name: Testes da Fazenda Aurora
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe dos módulos
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Testar plantio, renderer, fullscreen e interface
        run: npm test
      - name: Testar o jogo em navegador Chrome real (mobile horizontal)
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/aurora-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          timeout 50 "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1120,740 --virtual-time-budget=10000 \
            --dump-dom http://127.0.0.1:8000/tests/browser-smoke.html \
            > /tmp/aurora-dom.html
          if ! grep -q '<title>AURORA_BROWSER_PASS</title>' /tmp/aurora-dom.html; then
            echo 'Smoke test do navegador falhou:'
            grep -o 'SMOKE_FAIL[^<]*\|FALHA[^<]*' /tmp/aurora-dom.html | head -5 || true
            exit 1
          fi
          echo 'Chrome confirmou: cenário, sprites e zoom funcionando.'


      - name: Capturar imagem do layout no Chromium horizontal
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/aurora-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          timeout 30 "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --window-size=925,390 --virtual-time-budget=5000 \
            --screenshot=/tmp/aurora-mobile-preview.png http://127.0.0.1:8000/index.html >/tmp/aurora-shot.log 2>&1
          test -s /tmp/aurora-mobile-preview.png
      - name: Disponibilizar captura para revisão visual
        uses: actions/upload-artifact@v4
        with:
          name: fazenda-aurora-v034-mobile
          path: /tmp/aurora-mobile-preview.png
          retention-days: 7
