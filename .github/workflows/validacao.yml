name: Testes da Fazenda Aurora
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe dos módulos
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Testar plantio, renderer, fullscreen e interface
        run: npm test
